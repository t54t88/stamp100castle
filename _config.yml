# Feature List                            Edit, add or remove features to be presented.
features:
  - title: とてもシンプル
    description: スタンプラリーの状況を管理するだけに特化したシンプルなアプリです
    fontawesome_icon_name: stamp

  - title: 100名城の情報もここに集約
    description: 城の詳細画面からは、スタンプ設置場所や所在地などの情報を簡単に得ることができます
    fontawesome_icon_name: lightbulb

  - title: かんたんに記録ができる
    description: スタンプの記録は簡単3ステップで複雑な操作はいりません
    fontawesome_icon_name: pen-nib

  - title: 地図で進捗をひとめで確認
    description: 日本地図上で都道府県ごとの達成状況が色分けで見えるから、次に行く場所も決めやすい
    fontawesome_icon_name: map-location-dot

  - title: 進捗を可視化
    description: 全体・地域別の達成率をグラフで表示。どこまで巡ったかが一目でわかります
    fontawesome_icon_name: chart-pie

  - title: データをバックアップ
    description: 大切な訪問記録や写真をクラウドに保存できるから、機種変更のときも安心です
    fontawesome_icon_name: cloud-arrow-up

